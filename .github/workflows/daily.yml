name: daily job data

on:
  schedule:
    - cron: "11 8 * * *"   # 08:11 UTC, about 3am New York: published before the app's 7am run
  workflow_dispatch:
    inputs:
      long_tail:
        description: "Also add every employer site with job markup from Web Data Commons (about 60,000 sites; adds ~30 min)"
        type: boolean
        default: false

permissions:
  contents: write          # to publish the release files

concurrency:
  group: daily-data
  cancel-in-progress: false

jobs:
  crawl:
    # Five machines crawl side by side, each starting from yesterday's index; politeness per site is unchanged.
    strategy:
      fail-fast: false
      matrix:
        include:
          - {group: boards,     pages: "25000", workers: "0"}
          - {group: startups,   pages: "25000", workers: "0"}
          - {group: workday,    pages: "60000", workers: "24"}
          - {group: enterprise, pages: "40000", workers: "0"}
          - {group: longtail,   pages: "40000", workers: "0"}
    runs-on: ubuntu-latest
    timeout-minutes: 330
    env:
      GH_TOKEN: ${{ github.token }}
      JOBFEED_DATA: data
      CAREER_PAGES_PER_RUN: ${{ matrix.pages }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Start from yesterday's index
        run: |
          mkdir -p data
          if gh release download index --pattern index.db.gz --dir data 2>/dev/null; then
            gunzip -f data/index.db.gz
          else
            echo "no earlier index: first run"
          fi
      - name: Crawl ${{ matrix.group }}
        run: python -m jobfeed.datajob crawl --group ${{ matrix.group }} --workers ${{ matrix.workers }} --minutes 240
      - name: Package this group's results
        run: python -m jobfeed.datajob shard --group ${{ matrix.group }} --out shard-${{ matrix.group }}.db
      - uses: actions/upload-artifact@v4
        with:
          name: shard-${{ matrix.group }}
          path: shard-${{ matrix.group }}.db
          retention-days: 1

  publish:
    needs: crawl
    if: always()            # a failed group keeps yesterday's data for its platforms; the rest still publish
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      GH_TOKEN: ${{ github.token }}
      JOBFEED_DATA: data
      STREAM_COUNTRIES: US
      STREAM_USAJOBS: "0"   # USAJOBS data may not be republished; the app server fetches it privately
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt

      - name: Start from yesterday's index (keeps first-seen dates, reposts and history)
        run: |
          mkdir -p data
          if gh release download index --pattern index.db.gz --dir data 2>/dev/null; then
            gunzip -f data/index.db.gz && echo "restored $(du -h data/index.db | cut -f1)"
          else
            echo "no earlier index: first run"
          fi

      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          pattern: shard-*
          path: shards
          merge-multiple: true

      - name: Merge the groups
        run: python -m jobfeed.datajob merge shards/*.db

      - name: Extra feeds (Workable, Hacker News)
        run: python -m jobfeed.datajob streams

      - name: Visa sponsorship (new DOL file each quarter)
        run: python -m jobfeed.datajob sponsors

      - name: Find new company boards (Mondays, or when run by hand)
        run: |
          if [ "$(date -u +%u)" = "1" ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            WDC=""
            if [ "${{ inputs.long_tail }}" = "true" ]; then
              base=https://data.dws.informatik.uni-mannheim.de/structureddata/2024-12/quads/classspecific/JobPosting
              WDC=$(for i in $(seq 0 13); do printf "%s/part_%s.gz," "$base" "$i"; done)
            fi
            python -m jobfeed.datajob discover --wdc "$WDC" || echo "discovery skipped"
          fi

      - name: Signals, cleanup and export
        run: python -m jobfeed.datajob finish --out index.db.gz --summary summary.json

      - name: Publish
        run: |
          gh release view index >/dev/null 2>&1 || gh release create index --title "Job index" --notes "Rebuilt daily by the workflow. index.db.gz is the data; summary.json says what came in."
          gh release upload index index.db.gz summary.json --clobber
          python - <<'PY' >> "$GITHUB_STEP_SUMMARY"
          import json; s = json.load(open("summary.json"))
          print(f"### {s['open']:,} open roles from {s['companies']:,} companies")
          print(f"Published {s['published_at']}, {s['export_bytes']/1e6:,.0f} MB")
          for k, v in (s.get('by_source') or {}).items():
              print(f"- {k}: {v}")
          for k, v in ((s.get('last_crawl') or {}).get('top_failures') or []):
              print(f"- failing: {k} ×{v}")
          PY
